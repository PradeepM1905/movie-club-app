name: Generate Movie Quiz

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests gspread oauth2client pandas python-dotenv
        
    - name: Generate Quiz
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        # Add other Google Sheets secrets if needed
        type: ${{ secrets.GCP_TYPE }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        private_key_id: ${{ secrets.GCP_PRIVATE_KEY_ID }}
        private_key: ${{ secrets.GCP_PRIVATE_KEY }}
        client_email: ${{ secrets.GCP_CLIENT_EMAIL }}
        client_id: ${{ secrets.GCP_CLIENT_ID }}
        auth_uri: ${{ secrets.GCP_AUTH_URI }}
        token_uri: ${{ secrets.GCP_TOKEN_URI }}
        auth_provider_x509_cert_url: ${{ secrets.GCP_AUTH_PROVIDER_CERT_URL }}
        client_x509_cert_url: ${{ secrets.GCP_CLIENT_CERT_URL }}
      run: |
        python quiz_generator.py
